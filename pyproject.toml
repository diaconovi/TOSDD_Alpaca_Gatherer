[project]
name = "alpaca-gatherer"
version = "0.1.0"
description = "Keeps the mapping between Capital.com epics and Alpaca symbols up to date."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11,<4",
    "cryptography>=50.0.2",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "pydantic>=2",
    "pydantic-settings>=2.16.0",
    "pymongo>=4.13",
    "pyyaml>=6.0.3",
    "tenacity>=9.2.1",
    "to-collector-client",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpaca_gatherer"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
to-collector-client = { git = "ssh://git@github.com/diaconovi/Trade_Ops_Library.git", subdirectory = "packages/to_collector" }

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC", "PT", "C4", "RET", "PL"]
ignore = [
    "PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915",
    "N818",  # error names follow the problem codes (RunInProgress, CredentialsMissing, ...)
]

[tool.ruff.lint.isort]
known-first-party = ["alpaca_gatherer", "scripts", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
pythonpath = ["."]
markers = [
    "integration: needs a real MongoDB (MONGO_TEST_URL)",
    "contract: HTTP adapter tests against recorded responses",
    "golden: matching pipeline against the committed reference window",
]

[tool.coverage.run]
source = ["alpaca_gatherer.domain", "alpaca_gatherer.application"]
branch = false

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
